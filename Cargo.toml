[workspace]
resolver = "2"
members = [
    "crates/rrising-math",
    "crates/rrising-content",
    "crates/rrising-ecs",
    "crates/rrising-core",
    "crates/rrising-render",
    "crates/rrising-app",
    "crates/rrising-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
rrising-math = { path = "crates/rrising-math" }
rrising-content = { path = "crates/rrising-content" }
rrising-ecs = { path = "crates/rrising-ecs" }
rrising-core = { path = "crates/rrising-core" }
rrising-render = { path = "crates/rrising-render" }

anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
env_logger = "0.11"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
image = { version = "0.25", default-features = false, features = ["png"] }
indexmap = "2"
log = "0.4"
pollster = "1"
rustc-hash = "2"
serde_json = "1"
wgpu = "30"
winit = "0.30"

# The original content readers: UnityFS bundles, SerializedFile containers with type trees,
# streamed .resS resources, and the mesh/texture/material/scene decoders.
unity-formats = "0.5"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
