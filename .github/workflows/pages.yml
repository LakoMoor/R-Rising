name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: actions/configure-pages@v5
      - name: Install matching WebAssembly bindings generator
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build landing page and real WebGPU viewer
        run: ./tools/build_pages.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
